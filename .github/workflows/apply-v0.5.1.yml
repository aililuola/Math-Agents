name: Apply MathProofMesh v0.5.1 scheduler fix

on:
  push:
    branches:
      - feature/mathproofmesh-v0.5.0-resumable-checkpoints
    paths:
      - ".automation/v0.5.1.patch.xz.b64.*"
      - ".github/workflows/apply-v0.5.1.yml"

permissions:
  contents: write

concurrency:
  group: mathproofmesh-v0.5.1-scheduler-fix
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feature/mathproofmesh-v0.5.0-resumable-checkpoints
          fetch-depth: 0

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/v0.5.1.patch.xz.b64.* > /tmp/mathproofmesh-v0.5.1.patch.xz.b64
          base64 -d /tmp/mathproofmesh-v0.5.1.patch.xz.b64 > /tmp/mathproofmesh-v0.5.1.patch.xz
          echo "4515a27a6a1b6d57bc2f6dfa01992ad932c762242e1210c5e27260869e3ff000  /tmp/mathproofmesh-v0.5.1.patch.xz" | sha256sum -c -
          xz -dc /tmp/mathproofmesh-v0.5.1.patch.xz > /tmp/mathproofmesh-v0.5.1.patch
          test "$(wc -c < /tmp/mathproofmesh-v0.5.1.patch)" -eq 88844
          echo "5ed135a5c5bdec4d3ee37527696d2d63c96c71d31e0b1661e16cc24aa25a85f1  /tmp/mathproofmesh-v0.5.1.patch" | sha256sum -c -
          git apply --check /tmp/mathproofmesh-v0.5.1.patch
          git apply /tmp/mathproofmesh-v0.5.1.patch

      - name: Remove one-shot transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .automation
          rm -f .github/workflows/apply-v0.5.1.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"

      - name: Run deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m compileall -q src tests
          python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("BUILD_INFO.json").read_text(encoding="utf-8"))
          assert info["version"] == "0.5.1"
          assert info["validation"]["pytest"] == "48 passed"
          assert Path("tests/test_budget_scheduler.py").is_file()
          PY

      - name: Commit complete v0.5.1 source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: diversify failed proof search and reserve repair budget"
          git push origin HEAD:feature/mathproofmesh-v0.5.0-resumable-checkpoints
