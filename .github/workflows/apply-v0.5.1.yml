name: Apply MathProofMesh v0.5.1 scheduler fix

on:
  push:
    branches:
      - feature/mathproofmesh-v0.5.0-resumable-checkpoints
    paths:
      - ".automation/v0.5.1.patch.xz.b64.*"
      - ".github/workflows/apply-v0.5.1.yml"

permissions:
  contents: write

concurrency:
  group: mathproofmesh-v0.5.1-scheduler-fix
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feature/mathproofmesh-v0.5.0-resumable-checkpoints
          fetch-depth: 0

      - name: Verify staging commit and reconstruct patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8e87624a601c4852ed086e9c3080a188c7e85d44"
          test -f .github/workflows/publish-v0.5.1-scheduler.yml
          test -f .github/workflows/apply-v0.5.1.yml
          test "$(find .automation -maxdepth 1 -type f -name 'v0.5.1.patch.xz.b64.*' | wc -l)" -eq 15

          cat .automation/v0.5.1.patch.xz.b64.* > /tmp/mathproofmesh-v0.5.1.patch.xz.b64
          base64 --decode /tmp/mathproofmesh-v0.5.1.patch.xz.b64 > /tmp/mathproofmesh-v0.5.1.patch.xz
          echo "4515a27a6a1b6d57bc2f6dfa01992ad932c762242e1210c5e27260869e3ff000  /tmp/mathproofmesh-v0.5.1.patch.xz" | sha256sum -c -
          xz --decompress --stdout /tmp/mathproofmesh-v0.5.1.patch.xz > /tmp/mathproofmesh-v0.5.1.patch
          test "$(wc -c < /tmp/mathproofmesh-v0.5.1.patch)" -eq 88844
          echo "5ed135a5c5bdec4d3ee37527696d2d63c96c71d31e0b1661e16cc24aa25a85f1  /tmp/mathproofmesh-v0.5.1.patch" | sha256sum -c -

      - name: Apply scheduler patch and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/mathproofmesh-v0.5.1.patch
          git apply /tmp/mathproofmesh-v0.5.1.patch
          rm -rf .automation
          rm -f .github/workflows/apply-v0.5.1.yml
          rm -f .github/workflows/publish-v0.5.1-scheduler.yml
          test -f tests/test_budget_scheduler.py
          grep -q 'version = "0.5.1"' pyproject.toml
          grep -q '__version__ = "0.5.1"' src/mathproofmesh/__init__.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"

      - name: Run deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pytest -q
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m compileall -q src tests
          python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("BUILD_INFO.json").read_text(encoding="utf-8"))
          assert info["version"] == "0.5.1"
          assert info["validation"]["pytest"] == "48 passed"
          assert Path("tests/test_budget_scheduler.py").is_file()
          PY

      - name: Commit and push complete v0.5.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MathProofMesh Automation"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: diversify failed proof search and reserve repair budget"
          git push origin HEAD:feature/mathproofmesh-v0.5.0-resumable-checkpoints
