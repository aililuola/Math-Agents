name: Publish validated MathProofMesh v0.5.1 scheduler fix

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - "feature/mathproofmesh-v0.5.0-resumable-checkpoints"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mathproofmesh-v0.5.1-scheduler-target
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/mathproofmesh-v0.5.1-scheduler'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted target branch
        uses: actions/checkout@v4
        with:
          ref: feature/mathproofmesh-v0.5.0-resumable-checkpoints
          path: repo
          fetch-depth: 0

      - name: Check out staged patch data
        uses: actions/checkout@v4
        with:
          ref: automation/mathproofmesh-v0.5.1-scheduler
          path: staging
          fetch-depth: 1

      - name: Verify trusted base and apply content-addressed patch
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          test "$(git rev-parse HEAD^)" = "30c251f4409b3b82237998472768e70e9d8c93e0"
          test "$(git diff --name-only 30c251f4409b3b82237998472768e70e9d8c93e0..HEAD)" = ".github/workflows/publish-v0.5.1-scheduler.yml"
          cd ..

          cat staging/.github/patches/v0.5.1-scheduler/part-*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/mathproofmesh-v0.5.1-scheduler.patch
          echo "e8ac91960941b43ec9179f6d7eabe7806a1d7cb81d703233b07863949a709d7d  /tmp/mathproofmesh-v0.5.1-scheduler.patch" | sha256sum -c -

          cd repo
          git apply --check /tmp/mathproofmesh-v0.5.1-scheduler.patch
          git apply /tmp/mathproofmesh-v0.5.1-scheduler.patch
          rm .github/workflows/publish-v0.5.1-scheduler.yml

          test -f tests/test_budget_scheduler.py
          grep -q 'version = "0.5.1"' pyproject.toml
          grep -q '__version__ = "0.5.1"' src/mathproofmesh/__init__.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/pyproject.toml

      - name: Install package and development dependencies
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"

      - name: Run deterministic validation
        working-directory: repo
        run: bash scripts/validate.sh

      - name: Commit and push validated source to the existing feature branch
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MathProofMesh Automation"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: make scheduler failure-aware and preserve widening"
          git push origin HEAD:feature/mathproofmesh-v0.5.0-resumable-checkpoints
