name: Apply complete MathProofMesh v0.5.1 scheduler source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "feature/mathproofmesh-v0.5.0-resumable-checkpoints"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mathproofmesh-v0.5.1-final-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/mathproofmesh-v0.5.1-scheduler'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out exact target feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mathproofmesh-v0.5.0-resumable-checkpoints
          fetch-depth: 0

      - name: Verify target source and staging transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1734feac69f33136cd8b55f694cfe5584405277a"
          test -f RELEASE_NOTES_0.5.1.md
          test -f tests/test_budget_scheduler.py
          test -f .github/workflows/apply-v0.5.1.yml
          test -f .github/workflows/publish-v0.5.1-scheduler.yml
          test "$(find .automation -maxdepth 1 -type f -name 'v0.5.1.patch.xz.b64.*' | wc -l)" -eq 15
          python - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path("BUILD_INFO.json").read_text(encoding="utf-8"))
          assert info["version"] == "0.5.0", info["version"]
          PY

      - name: Reconstruct and verify exact source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/v0.5.1.patch.xz.b64.* > /tmp/mathproofmesh-v0.5.1.patch.xz
          test "$(wc -c < /tmp/mathproofmesh-v0.5.1.patch.xz)" -eq 20388
          echo "4515a27a6a1b6d57bc2f6dfa01992ad932c762242e1210c5e27260869e3ff000  /tmp/mathproofmesh-v0.5.1.patch.xz" | sha256sum -c -
          xz --test /tmp/mathproofmesh-v0.5.1.patch.xz
          xz --decompress --stdout /tmp/mathproofmesh-v0.5.1.patch.xz > /tmp/mathproofmesh-v0.5.1.patch
          test "$(wc -c < /tmp/mathproofmesh-v0.5.1.patch)" -eq 88844
          echo "5ed135a5c5bdec4d3ee37527696d2d63c96c71d31e0b1661e16cc24aa25a85f1  /tmp/mathproofmesh-v0.5.1.patch" | sha256sum -c -

      - name: Apply tracked-file scheduler patch
        shell: bash
        run: |
          set -euxo pipefail
          git apply --check --verbose /tmp/mathproofmesh-v0.5.1.patch
          git apply --verbose /tmp/mathproofmesh-v0.5.1.patch

      - name: Verify complete patched source
        shell: bash
        run: |
          set -euo pipefail
          test -f RELEASE_NOTES_0.5.1.md
          test -f tests/test_budget_scheduler.py
          grep -q 'version = "0.5.1"' pyproject.toml
          grep -q '__version__ = "0.5.1"' src/mathproofmesh/__init__.py
          python - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path("BUILD_INFO.json").read_text(encoding="utf-8"))
          assert info["version"] == "0.5.1"
          assert info["validation"]["pytest"] == "48 passed"
          PY

      - name: Remove one-shot transport and publisher files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .automation
          rm -f .github/workflows/apply-v0.5.1.yml
          rm -f .github/workflows/publish-v0.5.1-scheduler.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"

      - name: Run complete deterministic validation
        shell: bash
        run: bash scripts/validate.sh

      - name: Confirm clean final tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .automation
          test ! -e .github/workflows/apply-v0.5.1.yml
          test ! -e .github/workflows/publish-v0.5.1-scheduler.yml
          git status --short

      - name: Commit and push final v0.5.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MathProofMesh Automation"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: diversify failed proof search and reserve repair budget"
          git push origin HEAD:feature/mathproofmesh-v0.5.0-resumable-checkpoints
