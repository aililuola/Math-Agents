name: Publish clean MathProofMesh v0.5.1 scheduler fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "feature/mathproofmesh-v0.5.0-resumable-checkpoints"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mathproofmesh-v0.5.1-clean-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/mathproofmesh-v0.5.1-scheduler'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out staged patch transport
        uses: actions/checkout@v4
        with:
          ref: automation/mathproofmesh-v0.5.1-scheduler
          path: staging
          fetch-depth: 1

      - name: Check out clean validated v0.5.0 base
        uses: actions/checkout@v4
        with:
          ref: 8e87624a601c4852ed086e9c3080a188c7e85d44
          path: work
          fetch-depth: 0

      - name: Reconstruct and verify scheduler patch
        shell: bash
        run: |
          set -euo pipefail
          parts=(staging/.github/patches/v0.5.1-scheduler/part-*.b64)
          test "${#parts[@]}" -eq 7
          cat "${parts[@]}" > /tmp/mathproofmesh-v0.5.1.patch.gz.b64
          base64 --decode /tmp/mathproofmesh-v0.5.1.patch.gz.b64 > /tmp/mathproofmesh-v0.5.1.patch.gz
          gzip --test /tmp/mathproofmesh-v0.5.1.patch.gz
          gzip --decompress --stdout /tmp/mathproofmesh-v0.5.1.patch.gz > /tmp/mathproofmesh-v0.5.1.patch
          echo "e8ac91960941b43ec9179f6d7eabe7806a1d7cb81d703233b07863949a709d7d  /tmp/mathproofmesh-v0.5.1.patch" | sha256sum -c -

      - name: Apply patch to clean base
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/mathproofmesh-v0.5.1.patch
          git apply /tmp/mathproofmesh-v0.5.1.patch
          test -f tests/test_budget_scheduler.py
          grep -q 'version = "0.5.1"' pyproject.toml
          grep -q '__version__ = "0.5.1"' src/mathproofmesh/__init__.py
          test ! -d .automation
          test ! -d .github/patches

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: work/pyproject.toml

      - name: Install package and dependencies
        working-directory: work
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"

      - name: Run complete deterministic validation
        working-directory: work
        shell: bash
        run: bash scripts/validate.sh

      - name: Verify final source state
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("BUILD_INFO.json").read_text(encoding="utf-8"))
          assert info["version"] == "0.5.1"
          assert info["validation"]["pytest"] == "48 passed"
          assert Path("tests/test_budget_scheduler.py").is_file()
          assert not Path(".automation").exists()
          assert not Path(".github/patches").exists()
          PY

      - name: Commit and push clean v0.5.1 feature branch
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MathProofMesh Automation"
          git config user.email "noreply@users.noreply.github.com"
          git switch -C feature/mathproofmesh-v0.5.1-scheduler-fix
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: diversify failed proof search and reserve repair budget"
          git push --force-with-lease origin HEAD:feature/mathproofmesh-v0.5.1-scheduler-fix
