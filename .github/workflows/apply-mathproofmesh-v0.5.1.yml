name: Apply MathProofMesh v0.5.1 scheduler patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "feature/mathproofmesh-v0.5.0-resumable-checkpoints"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mathproofmesh-v0.5.1-scheduler-publish
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/mathproofmesh-v0.5.1-scheduler'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out staged patch
        uses: actions/checkout@v4
        with:
          ref: automation/mathproofmesh-v0.5.1-scheduler
          path: staging
          fetch-depth: 1

      - name: Check out target feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mathproofmesh-v0.5.0-resumable-checkpoints
          path: repo
          fetch-depth: 0

      - name: Verify exact target base
        working-directory: repo
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "8e87624a601c4852ed086e9c3080a188c7e85d44"
          test -f .github/workflows/publish-v0.5.1-scheduler.yml

      - name: Concatenate and verify encoded chunks
        shell: bash
        run: |
          set -euxo pipefail
          ls -l staging/.github/patches/v0.5.1-scheduler/part-*.b64
          cat staging/.github/patches/v0.5.1-scheduler/part-*.b64 > /tmp/mathproofmesh-v0.5.1-scheduler.patch.b64
          test "$(wc -c < /tmp/mathproofmesh-v0.5.1-scheduler.patch.b64)" = "34652"
          echo "57952a2e0ec7b0119a4afc15ac6a1269979a07e0034c632dfb9e85a9990d9757  /tmp/mathproofmesh-v0.5.1-scheduler.patch.b64" | sha256sum -c -

      - name: Decode encoded patch
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode /tmp/mathproofmesh-v0.5.1-scheduler.patch.b64 > /tmp/mathproofmesh-v0.5.1-scheduler.patch.gz

      - name: Verify compressed patch
        shell: bash
        run: |
          set -euxo pipefail
          gzip --test /tmp/mathproofmesh-v0.5.1-scheduler.patch.gz

      - name: Decompress and verify patch digest
        shell: bash
        run: |
          set -euxo pipefail
          gzip --decompress --stdout /tmp/mathproofmesh-v0.5.1-scheduler.patch.gz > /tmp/mathproofmesh-v0.5.1-scheduler.patch
          test "$(wc -c < /tmp/mathproofmesh-v0.5.1-scheduler.patch)" = "104724"
          test "$(wc -l < /tmp/mathproofmesh-v0.5.1-scheduler.patch)" = "2475"
          echo "e8ac91960941b43ec9179f6d7eabe7806a1d7cb81d703233b07863949a709d7d  /tmp/mathproofmesh-v0.5.1-scheduler.patch" | sha256sum -c -

      - name: Apply scheduler patch
        working-directory: repo
        shell: bash
        run: |
          set -euxo pipefail
          git apply --check /tmp/mathproofmesh-v0.5.1-scheduler.patch
          git apply /tmp/mathproofmesh-v0.5.1-scheduler.patch
          rm .github/workflows/publish-v0.5.1-scheduler.yml
          test -f tests/test_budget_scheduler.py
          grep -q 'version = "0.5.1"' pyproject.toml
          grep -q '__version__ = "0.5.1"' src/mathproofmesh/__init__.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/pyproject.toml

      - name: Install package and development dependencies
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"

      - name: Run deterministic validation
        working-directory: repo
        run: bash scripts/validate.sh

      - name: Commit and push validated source
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MathProofMesh Automation"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: make scheduler failure-aware and preserve widening"
          git push origin HEAD:feature/mathproofmesh-v0.5.0-resumable-checkpoints
