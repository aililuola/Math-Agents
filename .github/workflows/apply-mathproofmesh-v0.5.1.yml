name: Apply MathProofMesh v0.5.1 scheduler patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "feature/mathproofmesh-v0.5.0-resumable-checkpoints"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mathproofmesh-v0.5.1-scheduler-publish
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/mathproofmesh-v0.5.1-scheduler'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact target feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mathproofmesh-v0.5.0-resumable-checkpoints
          fetch-depth: 0

      - name: Verify target head and v0.5.0 metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7258fa22a5c6841c83f43b44adbc2be5d1b43fab"
          test -f .github/workflows/publish-v0.5.1-scheduler.yml
          test -f .github/workflows/apply-v0.5.1.yml
          python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("BUILD_INFO.json").read_text(encoding="utf-8"))
          assert info["version"] == "0.5.0", info["version"]
          PY

      - name: Verify staged chunk inventory
        shell: bash
        run: |
          set -euo pipefail
          find .automation -maxdepth 1 -type f -name 'v0.5.1.patch.xz.b64.*' -print | sort
          test "$(find .automation -maxdepth 1 -type f -name 'v0.5.1.patch.xz.b64.*' | wc -l)" -eq 15

      - name: Assemble and verify Base64 transport
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/v0.5.1.patch.xz.b64.* > /tmp/mathproofmesh-v0.5.1.patch.xz.b64
          test "$(wc -c < /tmp/mathproofmesh-v0.5.1.patch.xz.b64)" -eq 27184
          echo "9b1ddac1b539969f7c4839a4e55ef7bf677eca82f80050020201d2390f96b75b  /tmp/mathproofmesh-v0.5.1.patch.xz.b64" | sha256sum -c -

      - name: Decode and verify XZ transport
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/mathproofmesh-v0.5.1.patch.xz.b64 > /tmp/mathproofmesh-v0.5.1.patch.xz
          test "$(wc -c < /tmp/mathproofmesh-v0.5.1.patch.xz)" -eq 20388
          echo "4515a27a6a1b6d57bc2f6dfa01992ad932c762242e1210c5e27260869e3ff000  /tmp/mathproofmesh-v0.5.1.patch.xz" | sha256sum -c -
          xz --test /tmp/mathproofmesh-v0.5.1.patch.xz

      - name: Decompress and verify exact source patch
        shell: bash
        run: |
          set -euo pipefail
          xz --decompress --stdout /tmp/mathproofmesh-v0.5.1.patch.xz > /tmp/mathproofmesh-v0.5.1.patch
          test "$(wc -c < /tmp/mathproofmesh-v0.5.1.patch)" -eq 88844
          echo "5ed135a5c5bdec4d3ee37527696d2d63c96c71d31e0b1661e16cc24aa25a85f1  /tmp/mathproofmesh-v0.5.1.patch" | sha256sum -c -

      - name: Apply scheduler patch and remove temporary publisher files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/mathproofmesh-v0.5.1.patch
          git apply /tmp/mathproofmesh-v0.5.1.patch
          rm -rf .automation
          rm -f .github/workflows/apply-v0.5.1.yml
          rm -f .github/workflows/publish-v0.5.1-scheduler.yml
          test -f tests/test_budget_scheduler.py
          grep -q 'version = "0.5.1"' pyproject.toml
          grep -q '__version__ = "0.5.1"' src/mathproofmesh/__init__.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"

      - name: Run complete deterministic validation
        shell: bash
        run: bash scripts/validate.sh

      - name: Verify final source state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("BUILD_INFO.json").read_text(encoding="utf-8"))
          assert info["version"] == "0.5.1"
          assert info["validation"]["pytest"] == "48 passed"
          assert Path("tests/test_budget_scheduler.py").is_file()
          assert not Path(".automation").exists()
          assert not Path(".github/workflows/apply-v0.5.1.yml").exists()
          assert not Path(".github/workflows/publish-v0.5.1-scheduler.yml").exists()
          PY

      - name: Commit and push complete v0.5.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MathProofMesh Automation"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: diversify failed proof search and reserve repair budget"
          git push origin HEAD:feature/mathproofmesh-v0.5.0-resumable-checkpoints
