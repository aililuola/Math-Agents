name: CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,server]"

      - name: Run deterministic validation
        run: bash scripts/validate.sh
