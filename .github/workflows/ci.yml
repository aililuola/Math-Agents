name: JavaMathProofMesh release gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_USER: mathproofmesh
          POSTGRES_PASSWORD: clearly-fake-ci-password
          POSTGRES_DB: mathproofmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathproofmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The protected-authority architecture test compares against the
          # issue-007 baseline commit, which is unavailable in a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Prepare Python sidecar environment
        run: |
          python -m venv .venv-baseline
          .venv-baseline/bin/python -m pip install \
            --disable-pip-version-check \
            -r python-compute-service/requirements.in
          mkdir -p .venv-baseline/Scripts
          ln -s ../bin/python .venv-baseline/Scripts/python.exe
      - name: Verify Java, sidecar, coverage, and security gates
        env:
          MPM_ALLOW_LIVE_PROVIDER_CALLS: "false"
          TESTCONTAINERS_RYUK_CONTAINER_IMAGE: testcontainers/ryuk@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
        run: ./mvnw -B -ntp -Djavafx.platform=linux clean verify
      - name: Verify frozen source snapshot
        run: sha256sum -c SHA256SUMS.txt
      - name: Package platform-neutral release
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: java-mathproofmesh-linux
          path: |
            target/release/**
            migration/reports/phase-17-sbom.json
            migration/reports/dependency-check/**

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build server and CLI
        shell: powershell
        run: .\mvnw.cmd -B -ntp -pl :mathproofmesh-server -am package -DskipTests
      - name: Assemble Windows release bundle
        shell: powershell
        run: .\scripts\package-release.ps1 -SkipBuild -SkipDesktop
      - uses: actions/upload-artifact@v4
        with:
          name: java-mathproofmesh-windows
          path: target/release/**

  validate:
    if: ${{ always() }}
    needs:
      - verify
      - package-windows
    runs-on: ubuntu-latest
    steps:
      - name: Require all release gates
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PACKAGE_WINDOWS_RESULT: ${{ needs['package-windows'].result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$PACKAGE_WINDOWS_RESULT" = "success"
