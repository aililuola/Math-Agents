name: Assemble MathProofMesh orchestrator

on:
  push:
    branches:
      - feature/mathproofmesh-v0.4.0-deepseek-sse

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mathproofmesh-v0.4.0-deepseek-sse
          fetch-depth: 0

      - name: Assemble and validate orchestrator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/mathproofmesh
          cat .bootstrap/orchestrator.part* > src/mathproofmesh/orchestrator.py
          actual_sha="$(git hash-object src/mathproofmesh/orchestrator.py)"
          expected_sha="982b4e5d3e269efc28dd7f43ff17bcd43ed16058"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "orchestrator blob mismatch: expected $expected_sha, got $actual_sha" >&2
            exit 1
          fi
          python -m compileall -q src tests
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete MathProofMesh v0.4.0 orchestrator"
          git push origin HEAD:feature/mathproofmesh-v0.4.0-deepseek-sse
