system_name: MathProofMesh-DeepSeek-V4-Pro-Proof-Control-Shadow

# One environment variable per isolated sub-agent. Never place a real key in this file.
agents:
  - id: ds-planner
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_1_KEY
    user_id: mathproofmesh-agent-1
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [planner, meta_reviewer, final_verifier, experimenter, meta_strategist, inspiration_referee, conflict_resolver]
    specialties: [problem_decomposition, strategy_generation, failure_classification, meta_review]
    max_concurrency: 1
    temperature: 0.0
    # Keep the provider ceiling separate from the normal per-call operating budget.
    provider_max_output_tokens: 384000
    max_output_tokens: 384000
    timeout_seconds: 1920
    trust_prior: 0.55
    pricing: {input_per_million: 0.435, output_per_million: 0.87}

  - id: ds-explorer-a
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_2_KEY
    user_id: mathproofmesh-agent-2
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [explorer, summarizer, detailed_verifier, final_verifier, route_prover, route_skeptic, analogy_agent, invariant_hypothesis_agent]
    specialties: [number_theory, algebra, combinatorics, invariants, extremal_arguments]
    max_concurrency: 1
    temperature: 0.0
    provider_max_output_tokens: 384000
    max_output_tokens: 128000
    timeout_seconds: 1920
    trust_prior: 0.52
    pricing: {input_per_million: 0.435, output_per_million: 0.87}

  - id: ds-explorer-b
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_3_KEY
    user_id: mathproofmesh-agent-3
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [explorer, summarizer, detailed_verifier, final_verifier, route_prover, construction_inventor, representation_switchboard, reverse_goal_analyzer]
    specialties: [analysis, inequalities, geometry, probability, analytic_methods]
    max_concurrency: 1
    temperature: 0.0
    provider_max_output_tokens: 384000
    max_output_tokens: 128000
    timeout_seconds: 1920
    trust_prior: 0.52
    pricing: {input_per_million: 0.435, output_per_million: 0.87}

  - id: ds-explorer-c-verifier
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_4_KEY
    user_id: mathproofmesh-agent-4
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [explorer, summarizer, structural_verifier, detailed_verifier, final_verifier, route_prover, route_skeptic, route_referee, tool_specialist, bridge_prover, counterexample_hunter]
    specialties: [logic, graph_theory, constructive_proofs, counterexample_search, dependency_audit]
    max_concurrency: 1
    temperature: 0.0
    provider_max_output_tokens: 384000
    max_output_tokens: 128000
    timeout_seconds: 1920
    trust_prior: 0.54
    pricing: {input_per_million: 0.435, output_per_million: 0.87}

  - id: ds-synthesizer-verifier
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_5_KEY
    user_id: mathproofmesh-agent-5
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [synthesizer, structural_verifier, detailed_verifier, final_verifier, route_referee, inspiration_referee, conflict_resolver]
    specialties: [proof_synthesis, rigorous_exposition, proof_audit, symbolic_checks]
    max_concurrency: 1
    temperature: 0.0
    provider_max_output_tokens: 384000
    max_output_tokens: 128000
    timeout_seconds: 1920
    trust_prior: 0.56
    pricing: {input_per_million: 0.435, output_per_million: 0.87}

budget:
  max_total_calls: 450
  max_rounds: 24
  # Opt-in test-time compute scaling for olympiad/research-rated problems;
  # token and cost ceilings are never scaled.
  scale_budget_with_difficulty: false
  initial_paths: 6
  # Leave room for active inspiration and surprise routes after initialization.
  max_paths: 12
  strategies_to_generate: 12
  candidates_to_verify: 3
  max_revisions: 3
  base_verifier_replicas: 1
  high_risk_verifier_replicas: 2
  high_risk_threshold: 0.45
  verification_pass_threshold: 0.80
  synthesis_threshold: 0.74
  max_total_tokens: 30000000
  max_cost_usd: 10.0
  breadth_share: 0.30
  depth_share: 0.35
  verification_share: 0.25
  synthesis_share: 0.10

scheduler:
  hard_stagnation_enabled: true
  max_normal_attempts_per_signature: 1
  max_repair_attempts_per_signature: 1
  global_no_progress_rounds_before_meta_pivot: 2
  global_no_progress_rounds_before_stop: 3
  # All values are policy controls, not assumptions tied to a particular theorem.
  max_actions_per_round: 2
  widen_paths_per_action: 2
  force_widen_when_all_failed: true
  max_execution_repairs_per_path: 1
  max_plan_repairs_per_path: 1
  max_unknown_failure_repairs_per_path: 1
  allow_strategy_failure_repair: false
  failed_path_cooldown_rounds: 1
  meaningful_progress_threshold: 0.04
  unverified_progress_discount: 0.55
  uncertain_progress_discount: 0.40
  failed_progress_discount: 0.10
  structural_failure_progress_cap: 0.10
  execution_failure_progress_cap: 0.45
  plan_failure_progress_cap: 0.18
  strategy_failure_progress_cap: 0.05
  structural_failure_penalty: 0.30
  execution_failure_penalty: 0.12
  plan_failure_penalty: 0.30
  strategy_failure_penalty: 0.50
  repeated_failure_penalty: 0.15
  reserve_revision_cycles: 1
  include_post_action_verification_in_cost: true
  include_meta_review_in_cost: true
  verification_call_safety_margin: 0
  finish_transition_buffer_calls: 1
  diagnostics_enabled: true
  diagnostic_candidate_limit: 12

topology:
  mode: hierarchical_sparse
  neighbor_k: 2
  # All five agents use the same provider/model, so independence is enforced by key,
  # user_id, isolated first-pass prompts, and author exclusion rather than provider diversity.
  prefer_cross_provider_review: false
  isolate_initial_exploration: true
  conditional_cross_review: true
  disagreement_threshold: 0.30
  strategy_similarity_threshold: 0.70
  max_context_chars: 180000
  max_verified_claims_per_context: 30
  preserve_raw_evidence: true
  typed_communication:
    enabled: true
  route_teams:
    enabled: true
    max_members_per_route: 4
  cross_route:
    enabled: true
    initial_isolation_rounds: 1
    max_neighbors_per_route: 2
    max_messages_per_route_per_round: 6
    max_global_messages_per_round: 24
  proof_graph:
    enabled: true
    mode: active
  typed_memory:
    enabled: true
    strict_fact_gate: true
  inspiration:
    enabled: true
    mode: active
    # Generate up to three candidates per admitted task. With three eligible
    # agents this is two warm candidates plus one de-anchored cold candidate.
    active_proposals_per_task: 3
    # The proposer pool is derived from every enabled agent carrying one of
    # these roles; it is not tied to a fixed number of API keys.
    proposer_generalist_roles: [explorer, route_prover]
    max_single_agent_proposals_per_task: 2
    max_reviewed_proposals_per_task: 2
    max_materialized_proposals_per_trigger: 1
    cold_context_proposals_per_task: 1
    warm_context_max_facts: 5
    warm_context_max_negatives: 5
    inspiration_context_max_chars: 24000
    # Covers proposer population, independent reviews, skeptics, and the first
    # real route attempt; unused reserved calls are released after the task.
    surprise_budget_min_calls: 10
    surprise_budget_max_calls: 32
    representation_switchboard: true
    analogy_agent: true
    auxiliary_construction_inventor: true
    invariant_hypothesis_agent: true
    reverse_goal_analysis: true
    bridge_lemma_generator: true
    persistent_meta_strategist: true
    surprise_exploration: true
    # Domain operators carry explicit preconditions, generated obligations,
    # reversibility checks, fast falsification tests, and known failure modes.
    domain_operator_plugins_enabled: true
    domain_operator_max_prompt_items: 8
    # Reverse-goal analysis meets Broker-admitted forward facts with a bounded
    # backward frontier and emits only the missing bridge implications.
    bidirectional_frontier_enabled: true
    frontier_max_forward_claims: 8
    frontier_max_backward_claims: 8
    frontier_max_bridge_candidates: 3
    frontier_min_candidate_overlap: 0.35
    # Complementary reviewed proposals may be composed, but the composition is
    # independently reviewed on a later scheduler turn before materialization.
    inspiration_composer_enabled: true
    composer_max_candidates_per_round: 2
    composer_max_sources: 2
    composer_max_combined_cost: 4
    composer_require_quick_falsification: true
    # Surprise exploration uses a seeded, replayable structural mutation rather
    # than merely selecting a lower-ranked representation.
    controlled_surprise_mutation_enabled: true
    # Meta-Strategist outputs are audited control directives, not Insights or Facts.
    meta_directives_enabled: true
    meta_directive_expiry_rounds: 2
    meta_directive_cooldown_rounds: 2
    meta_directive_max_estimated_calls: 8
    meta_allow_route_abandon: true
    # Learn scheduling value from verified downstream outcomes while retaining
    # a fixed exploration floor. These scores can never pass a proof gate.
    adaptive_mechanism_selection: true
    adaptive_min_observations: 1
    adaptive_min_exploration_rate: 0.15
    adaptive_ucb_weight: 0.75
    # Only Broker-admitted, independently verified Facts can seed positive
    # experiences. Failed analogy transfers enter a separate negative library.
    experience_distillation_enabled: true
    negative_analogy_library_enabled: true
    max_distilled_experiences: 256
    max_negative_analogy_records: 256
    # Store only approved structured experience/outcome records. The directory
    # is local and git-ignored; prompts, chain-of-thought, API output, and keys
    # are never written to this learning store.
    cross_run_learning_enabled: true
    cross_run_learning_path: .mathproofmesh/learning
    cross_run_require_final_citation: true
    cross_run_max_experiences: 2000
    cross_run_max_negative_analogies: 2000
    cross_run_max_outcomes: 10000
  validation_escalation:
    enabled: true
  agent_capability:
    enabled: true
  # Recommended v0.8 rollout profile: observe every decision without blocking
  # v0.7 routing, deepening, graph closure, or synthesis.
  proof_control:
    enabled: true
    mode: shadow
    strict_fail_closed: true
    bottleneck:
      mode: shadow
    route_admission:
      mode: shadow
    continue_gate:
      mode: shadow
    synthesis_readiness:
      mode: shadow

verification:
  structural_first: true
  detailed_only_after_structural_pass: true
  verify_problem_integrity: true
  require_first_error_step: true
  require_key_step_tagging: true
  enable_sympy_tools: true
  enable_numeric_counterexamples: true
  enable_lean: false
  lean_command: lake env lean
  external_tool_timeout_seconds: 30

continuation:
  # Segment long proofs into independently verified, persistent mathematical checkpoints.
  enabled: true
  checkpoint_policy: verified_subgoal
  max_new_steps_per_call: 20
  max_new_claims_per_call: 3
  max_output_tokens_per_segment: 128000
  # Keep each scheduler action small enough to preserve breadth and final-audit calls.
  # Two consecutive segments may advance, but every delta is independently reviewed.
  segments_per_explore_call: 2
  max_segments_per_path: 20
  verify_each_delta: true
  delta_verifier_replicas: 1
  checkpoint_pass_threshold: 0.80
  resume_on_disconnect: true
  allow_cross_agent_failover: true
  max_failover_agents: 2
  process_resume_enabled: true
  retain_rejected_deltas: true
  # Fallback/highest public-state diagnostic limit; tier failures use 8K/12K/16K.
  post_failure_bottleneck_enabled: true
  post_failure_bottleneck_max_output_tokens: 16000
  post_failure_bottleneck_once_per_checkpoint: true
  post_failure_trigger_inspiration: true

deep_exploration_policy:
  enabled: true
  # New routes start at 96K/max. The 64K tier is retained only for one bounded
  # same-signature repair or an ambiguous-novelty repair. Distinct signatures
  # may use 96K/128K concurrently without a global high-tier semaphore.
  tiers:
    - output_tokens: 64000
      artifact_recovery_tokens: 8000
    - output_tokens: 96000
      artifact_recovery_tokens: 12000
    - output_tokens: 128000
      artifact_recovery_tokens: 16000
  high_tier_threshold_tokens: 96000
  partial_repair_max_output_tokens: 64000
  max_partial_repairs_per_signature: 1
  max_running_per_signature: 1
  no_progress_high_tier_limit_per_signature: 1
  semantic_duplicate_threshold: 0.86
  allow_parallel_distinct_signatures: true
  allow_local_bottleneck_pivot: true
  require_novelty_review_for_pivot: true
  require_meta_approval_for_128k: true
  min_remaining_calls_for_128k: 8
  min_remaining_tokens_for_128k: 256000
  preserve_parent_verified_checkpoint: true
  reset_on_verified_checkpoint: true
  reset_on_referee_confirmed_mechanism_change: true
  persist_across_resume: true

computation:
  enabled: true
  policy: reasoning_first
  typed_tools_enabled: true
  sandboxed_python_enabled: true
  sandbox_image: python@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93
  sandbox_timeout_seconds: 20
  sandbox_memory_mb: 256
  sandbox_cpus: 1
  sandbox_pids_limit: 32
  execute_planner_hints_immediately: false
  critical_calculation_gate_enabled: true
  critical_calculation_require_declarations: true
  critical_calculation_max_checks_per_artifact: 8
  targeted_falsification_fast_path: true
  bounded_typed_probe_fast_path: true
  bounded_typed_probe_max_cases: 25000
  soft_experiments_per_path: 2
  hard_experiments_per_path: 6
  # Preserve the shipped one-cycle default; experiments may opt in explicitly.
  max_compute_cycles_per_segment: 1
  max_contract_repairs_per_segment: 1
  contract_repair_max_output_tokens: 8192
  max_total_cpu_seconds: 120
  max_cases_per_experiment: 1000000
  max_output_chars: 20000
  broad_search_after_stalled_rounds: 1
  broad_search_requires_meta_review: true
  cache_results: true

runtime:
  run_root: runs
  output_language: zh-CN
  max_parallel_calls: 5
  parse_retries: 1
  request_retries: 3
  checkpoint_every_stage: true
  # DeepSeek reasoning_content is stripped by the provider adapter before raw metadata is saved.
  save_raw_provider_responses: true
  redact_prompts_in_console: true
  # Live progress shows only stage summaries and structured outcomes, never raw chain of thought.
  activity_mode: compact
  activity_max_visible: 18
  activity_persist: true
  activity_include_agent_calls: true
  activity_heartbeat_seconds: 20
  # Token limits govern normal reasoning. Time only detects a dead SSE stream or
  # provides a common two-hour emergency ceiling for a broken provider call.
  stream_first_chunk_timeout_seconds: 90
  stream_idle_timeout_seconds: 300
  agent_call_wall_timeout_seconds: 7200
  json_repair_max_output_tokens: 8192
  # Compatibility mirror; admission is controlled by deep_exploration_policy.
  exploration_output_token_tiers: [64000, 96000, 128000]
  # Routine structured stages should not spend their entire output budget on
  # private reasoning. Strategy generation is the deliberate 384K/max exception;
  # deep route calls keep max only after 96K admission.
  stage_thinking_modes:
    goal_normalization: disabled
    triage: disabled
    claim_extraction: disabled
    post_failure_bottleneck: disabled
    computation_contract_repair: disabled
    pattern_conjecture_completion: disabled
    strategy_generation: max
    independent_exploration: tiered
    proof_continuation: tiered
    route_prove: tiered
    structural_verification: high
    checkpoint_verification: high
    detailed_verification: high
    final_verification: high
    blind_structural_verification: high
    blind_detailed_verification: high
    meta_review: high
    route_skeptic: high
    route_referee: high
    route_tool_audit: high
    synthesis: high
    final_revision: high
  stage_output_token_limits:
    goal_normalization: 4096
    triage: 12000
    strategy_generation: 384000
    claim_extraction: 12000
    structural_verification: 16000
    checkpoint_verification: 24000
    detailed_verification: 32000
    final_verification: 32000
    blind_structural_verification: 16000
    blind_detailed_verification: 32000
    meta_review: 16000
    route_skeptic: 24000
    route_referee: 16000
    route_tool_audit: 16000
    representation_switchboard: 24000
    structural_analogy_search: 24000
    invent_auxiliary_construction: 24000
    hypothesize_invariant: 24000
    reverse_goal_analysis: 24000
    persistent_meta_strategy: 24000
    surprise_exploration: 24000
    inspiration_referee: 16000
    post_failure_bottleneck: 16000
    synthesis: 64000
    final_revision: 64000
    experiment_codegen: 12000
    computation_contract_repair: 8192
    pattern_conjecture_completion: 4096
  # Two distinct keys failing in one short window identify a shared transport fault.
  provider_circuit_breaker_enabled: true
  provider_circuit_failure_threshold: 2
  provider_circuit_window_seconds: 90
  provider_circuit_cooldown_seconds: 300
  provider_terminal_http_statuses: [402]
  provider_shared_auth_http_statuses: [401, 403]
  log_level: INFO
  random_seed: 20260719
