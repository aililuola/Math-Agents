[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mathproofmesh"
version = "0.6.0"
description = "A sparse, verification-first multi-agent system for difficult mathematical and logical reasoning."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MathProofMesh contributors"}]
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "sympy>=1.12,<2",
  "networkx>=3.3,<4",
  "z3-solver>=4.13,<5",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<1", "ruff>=0.9,<1"]

[project.scripts]
mathproofmesh = "mathproofmesh.cli:app"

[tool.hatch.build]
exclude = [
  "/.env",
  "/.venv",
  "/dist",
  "/my_problem.txt",
  "/run-deepseek.ps1",
  "/runs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mathproofmesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
