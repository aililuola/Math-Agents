system_name: MathProofMesh-DeepSeek-V4-Pro-Topology-Active

# One environment variable per isolated sub-agent. Never place a real key in this file.
agents:
  - id: ds-planner
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_1_KEY
    user_id: mathproofmesh-agent-1
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [planner, meta_reviewer, final_verifier, experimenter, meta_strategist, inspiration_referee, conflict_resolver]
    specialties: [problem_decomposition, strategy_generation, failure_classification, meta_review]
    max_concurrency: 1
    temperature: 0.0
    # Keep the provider ceiling separate from the normal per-call operating budget.
    provider_max_output_tokens: 384000
    max_output_tokens: 96000
    timeout_seconds: 900
    trust_prior: 0.55
    pricing: {input_per_million: 0.435, output_per_million: 0.87}

  - id: ds-explorer-a
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_2_KEY
    user_id: mathproofmesh-agent-2
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [explorer, summarizer, detailed_verifier, final_verifier, route_prover, route_skeptic, analogy_agent, invariant_hypothesis_agent]
    specialties: [number_theory, algebra, combinatorics, invariants, extremal_arguments]
    max_concurrency: 1
    temperature: 0.0
    provider_max_output_tokens: 384000
    max_output_tokens: 96000
    timeout_seconds: 900
    trust_prior: 0.52
    pricing: {input_per_million: 0.435, output_per_million: 0.87}

  - id: ds-explorer-b
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_3_KEY
    user_id: mathproofmesh-agent-3
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [explorer, summarizer, detailed_verifier, final_verifier, route_prover, construction_inventor, representation_switchboard, reverse_goal_analyzer]
    specialties: [analysis, inequalities, geometry, probability, analytic_methods]
    max_concurrency: 1
    temperature: 0.0
    provider_max_output_tokens: 384000
    max_output_tokens: 96000
    timeout_seconds: 900
    trust_prior: 0.52
    pricing: {input_per_million: 0.435, output_per_million: 0.87}

  - id: ds-explorer-c-verifier
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_4_KEY
    user_id: mathproofmesh-agent-4
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [explorer, summarizer, structural_verifier, detailed_verifier, final_verifier, route_prover, route_skeptic, route_referee, tool_specialist, bridge_prover, counterexample_hunter]
    specialties: [logic, graph_theory, constructive_proofs, counterexample_search, dependency_audit]
    max_concurrency: 1
    temperature: 0.0
    provider_max_output_tokens: 384000
    max_output_tokens: 96000
    timeout_seconds: 900
    trust_prior: 0.54
    pricing: {input_per_million: 0.435, output_per_million: 0.87}

  - id: ds-synthesizer-verifier
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_5_KEY
    user_id: mathproofmesh-agent-5
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [synthesizer, structural_verifier, detailed_verifier, final_verifier, route_referee, inspiration_referee, conflict_resolver]
    specialties: [proof_synthesis, rigorous_exposition, proof_audit, symbolic_checks]
    max_concurrency: 1
    temperature: 0.0
    provider_max_output_tokens: 384000
    max_output_tokens: 96000
    timeout_seconds: 900
    trust_prior: 0.56
    pricing: {input_per_million: 0.435, output_per_million: 0.87}

budget:
  max_total_calls: 150
  max_rounds: 8
  initial_paths: 6
  # Leave room for active inspiration and surprise routes after initialization.
  max_paths: 12
  strategies_to_generate: 12
  candidates_to_verify: 3
  max_revisions: 3
  base_verifier_replicas: 1
  high_risk_verifier_replicas: 2
  high_risk_threshold: 0.45
  verification_pass_threshold: 0.80
  synthesis_threshold: 0.74
  max_total_tokens: 10000000
  max_cost_usd: 10.0
  breadth_share: 0.30
  depth_share: 0.35
  verification_share: 0.25
  synthesis_share: 0.10

scheduler:
  # All values are policy controls, not assumptions tied to a particular theorem.
  max_actions_per_round: 2
  widen_paths_per_action: 2
  force_widen_when_all_failed: true
  max_execution_repairs_per_path: 1
  max_plan_repairs_per_path: 1
  max_unknown_failure_repairs_per_path: 1
  allow_strategy_failure_repair: false
  failed_path_cooldown_rounds: 1
  meaningful_progress_threshold: 0.04
  unverified_progress_discount: 0.55
  uncertain_progress_discount: 0.40
  failed_progress_discount: 0.10
  structural_failure_progress_cap: 0.10
  execution_failure_progress_cap: 0.45
  plan_failure_progress_cap: 0.18
  strategy_failure_progress_cap: 0.05
  structural_failure_penalty: 0.30
  execution_failure_penalty: 0.12
  plan_failure_penalty: 0.30
  strategy_failure_penalty: 0.50
  repeated_failure_penalty: 0.15
  reserve_revision_cycles: 1
  include_post_action_verification_in_cost: true
  include_meta_review_in_cost: true
  verification_call_safety_margin: 0
  finish_transition_buffer_calls: 1
  diagnostics_enabled: true
  diagnostic_candidate_limit: 12

topology:
  mode: hierarchical_sparse
  neighbor_k: 2
  # All five agents use the same provider/model, so independence is enforced by key,
  # user_id, isolated first-pass prompts, and author exclusion rather than provider diversity.
  prefer_cross_provider_review: false
  isolate_initial_exploration: true
  conditional_cross_review: true
  disagreement_threshold: 0.30
  strategy_similarity_threshold: 0.70
  max_context_chars: 180000
  max_verified_claims_per_context: 30
  preserve_raw_evidence: true
  typed_communication:
    enabled: true
  route_teams:
    enabled: true
    max_members_per_route: 4
  cross_route:
    enabled: true
    initial_isolation_rounds: 1
    max_neighbors_per_route: 2
    max_messages_per_route_per_round: 6
    max_global_messages_per_round: 24
  proof_graph:
    enabled: true
    mode: active
  typed_memory:
    enabled: true
    strict_fact_gate: true
  inspiration:
    enabled: true
    mode: active
    representation_switchboard: true
    analogy_agent: true
    auxiliary_construction_inventor: true
    invariant_hypothesis_agent: true
    reverse_goal_analysis: true
    bridge_lemma_generator: true
    persistent_meta_strategist: true
    surprise_exploration: true
  validation_escalation:
    enabled: true
  agent_capability:
    enabled: true

verification:
  structural_first: true
  detailed_only_after_structural_pass: true
  verify_problem_integrity: true
  require_first_error_step: true
  require_key_step_tagging: true
  enable_sympy_tools: true
  enable_numeric_counterexamples: true
  enable_lean: false
  lean_command: lake env lean
  external_tool_timeout_seconds: 30

continuation:
  # Segment long proofs into independently verified, persistent mathematical checkpoints.
  enabled: true
  checkpoint_policy: verified_subgoal
  max_new_steps_per_call: 20
  max_new_claims_per_call: 3
  max_output_tokens_per_segment: 96000
  # Keep each scheduler action small enough to preserve breadth and final-audit calls.
  segments_per_explore_call: 1
  max_segments_per_path: 20
  verify_each_delta: true
  delta_verifier_replicas: 1
  checkpoint_pass_threshold: 0.80
  resume_on_disconnect: true
  allow_cross_agent_failover: true
  max_failover_agents: 2
  process_resume_enabled: true
  retain_rejected_deltas: true

computation:
  enabled: true
  policy: reasoning_first
  typed_tools_enabled: true
  sandboxed_python_enabled: true
  sandbox_image: python@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93
  sandbox_timeout_seconds: 20
  sandbox_memory_mb: 256
  sandbox_cpus: 1
  sandbox_pids_limit: 32
  execute_planner_hints_immediately: false
  targeted_falsification_fast_path: true
  soft_experiments_per_path: 2
  hard_experiments_per_path: 6
  max_compute_cycles_per_segment: 1
  max_total_cpu_seconds: 120
  max_cases_per_experiment: 1000000
  max_output_chars: 20000
  broad_search_after_stalled_rounds: 1
  broad_search_requires_meta_review: true
  cache_results: true

runtime:
  run_root: runs
  output_language: zh-CN
  max_parallel_calls: 5
  parse_retries: 1
  request_retries: 3
  checkpoint_every_stage: true
  # DeepSeek reasoning_content is stripped by the provider adapter before raw metadata is saved.
  save_raw_provider_responses: true
  redact_prompts_in_console: true
  # Live progress shows only stage summaries and structured outcomes, never raw chain of thought.
  activity_mode: compact
  activity_max_visible: 18
  activity_persist: true
  activity_include_agent_calls: true
  activity_heartbeat_seconds: 20
  # Bound the whole SSE request, not only the provider socket's idle read time.
  agent_call_wall_timeout_seconds: 1200
  # Abort a stream that spends twelve minutes in reasoning without starting JSON.
  reasoning_only_abort_seconds: 720
  reasoning_only_min_characters: 4096
  json_repair_max_output_tokens: 8192
  # Deep route work escalates only after earlier verified segments need more room.
  exploration_output_token_tiers: [32000, 64000, 96000]
  stage_output_token_limits:
    triage: 12000
    strategy_generation: 24000
    claim_extraction: 12000
    structural_verification: 16000
    checkpoint_verification: 24000
    detailed_verification: 32000
    final_verification: 32000
    blind_structural_verification: 16000
    blind_detailed_verification: 32000
    meta_review: 16000
    route_skeptic: 24000
    route_referee: 16000
    route_tool_audit: 16000
    representation_switchboard: 24000
    structural_analogy_search: 24000
    invent_auxiliary_construction: 24000
    hypothesize_invariant: 24000
    reverse_goal_analysis: 24000
    persistent_meta_strategy: 24000
    surprise_exploration: 24000
    inspiration_referee: 16000
    synthesis: 64000
    final_revision: 64000
    experiment_codegen: 12000
  # Two distinct keys failing in one short window identify a shared transport fault.
  provider_circuit_breaker_enabled: true
  provider_circuit_failure_threshold: 2
  provider_circuit_window_seconds: 90
  provider_circuit_cooldown_seconds: 300
  log_level: INFO
  random_seed: 20260719
