system_name: MathProofMesh-DeepSeek-V4-Pro-Smoke

agents:
  -
    id: ds-planner
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_1_KEY
    user_id: mathproofmesh-smoke-agent-1
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [planner, meta_reviewer, final_verifier, experimenter]
    specialties: [problem_decomposition, strategy_generation, meta_review]
    max_concurrency: 1
    temperature: 0.0
    max_output_tokens: 50000
    timeout_seconds: 600
    pricing: {input_per_million: 0.435, output_per_million: 0.87}
  - id: ds-explorer-a
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_2_KEY
    user_id: mathproofmesh-smoke-agent-2
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [explorer, summarizer, detailed_verifier, final_verifier]
    specialties: [number_theory, algebra, combinatorics]
    max_concurrency: 1
    temperature: 0.0
    max_output_tokens: 50000
    timeout_seconds: 600
    pricing: {input_per_million: 0.435, output_per_million: 0.87}
  - id: ds-explorer-b
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_3_KEY
    user_id: mathproofmesh-smoke-agent-3
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [explorer, summarizer, detailed_verifier, final_verifier]
    specialties: [analysis, inequalities, geometry]
    max_concurrency: 1
    temperature: 0.0
    max_output_tokens: 50000
    timeout_seconds: 600
    pricing: {input_per_million: 0.435, output_per_million: 0.87}
  - id: ds-verifier
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_4_KEY
    user_id: mathproofmesh-smoke-agent-4
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [structural_verifier, detailed_verifier, final_verifier]
    specialties: [proof_audit, counterexample_search]
    max_concurrency: 1
    temperature: 0.0
    max_output_tokens: 50000
    timeout_seconds: 600
    pricing: {input_per_million: 0.435, output_per_million: 0.87}
  - id: ds-synthesizer
    provider: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_AGENT_5_KEY
    user_id: mathproofmesh-smoke-agent-5
    thinking_enabled: true
    reasoning_effort: max
    streaming: true
    roles: [synthesizer, structural_verifier, detailed_verifier, final_verifier]
    specialties: [proof_synthesis, rigorous_exposition]
    max_concurrency: 1
    temperature: 0.0
    max_output_tokens: 50000
    timeout_seconds: 600
    pricing: {input_per_million: 0.435, output_per_million: 0.87}

budget:
  max_total_calls: 28
  # Initial exploration plus one adaptive round.
  max_rounds: 2
  initial_paths: 2
  max_paths: 3
  strategies_to_generate: 3
  candidates_to_verify: 2
  max_revisions: 1
  base_verifier_replicas: 1
  high_risk_verifier_replicas: 1
  high_risk_threshold: 0.45
  verification_pass_threshold: 0.78
  synthesis_threshold: 0.70
  max_total_tokens: 300000
  max_cost_usd: 0.75
  breadth_share: 0.30
  depth_share: 0.35
  verification_share: 0.25
  synthesis_share: 0.10

scheduler:
  max_actions_per_round: 2
  widen_paths_per_action: 1
  force_widen_when_all_failed: true
  max_execution_repairs_per_path: 1
  max_plan_repairs_per_path: 1
  max_unknown_failure_repairs_per_path: 1
  allow_strategy_failure_repair: false
  failed_path_cooldown_rounds: 1
  meaningful_progress_threshold: 0.04
  unverified_progress_discount: 0.55
  uncertain_progress_discount: 0.40
  failed_progress_discount: 0.10
  structural_failure_progress_cap: 0.10
  execution_failure_progress_cap: 0.45
  plan_failure_progress_cap: 0.18
  strategy_failure_progress_cap: 0.05
  structural_failure_penalty: 0.30
  execution_failure_penalty: 0.12
  plan_failure_penalty: 0.30
  strategy_failure_penalty: 0.50
  repeated_failure_penalty: 0.15
  reserve_revision_cycles: 1
  include_post_action_verification_in_cost: true
  include_meta_review_in_cost: true
  verification_call_safety_margin: 0
  finish_transition_buffer_calls: 0
  diagnostics_enabled: true
  diagnostic_candidate_limit: 8

topology:
  neighbor_k: 1
  prefer_cross_provider_review: false
  isolate_initial_exploration: true
  conditional_cross_review: false
  disagreement_threshold: 0.35
  strategy_similarity_threshold: 0.72
  max_context_chars: 70000
  max_verified_claims_per_context: 12
  preserve_raw_evidence: true

verification:
  structural_first: true
  detailed_only_after_structural_pass: true
  verify_problem_integrity: true
  require_first_error_step: true
  require_key_step_tagging: true
  enable_sympy_tools: true
  enable_numeric_counterexamples: true
  enable_lean: false
  lean_command: lake env lean
  external_tool_timeout_seconds: 20

continuation:
  enabled: true
  checkpoint_policy: verified_subgoal
  max_new_steps_per_call: 8
  max_new_claims_per_call: 2
  # Leave enough room for max-effort reasoning before the structured JSON answer.
  max_output_tokens_per_segment: 50000
  segments_per_explore_call: 1
  max_segments_per_path: 4
  verify_each_delta: true
  delta_verifier_replicas: 1
  checkpoint_pass_threshold: 0.78
  resume_on_disconnect: true
  allow_cross_agent_failover: true
  max_failover_agents: 1
  process_resume_enabled: true
  retain_rejected_deltas: true

computation:
  enabled: true
  policy: reasoning_first
  typed_tools_enabled: true
  sandboxed_python_enabled: false
  execute_planner_hints_immediately: false
  targeted_falsification_fast_path: true
  soft_experiments_per_path: 2
  hard_experiments_per_path: 6
  max_compute_cycles_per_segment: 1
  max_total_cpu_seconds: 120
  max_cases_per_experiment: 1000000
  max_output_chars: 20000
  broad_search_after_stalled_rounds: 1
  broad_search_requires_meta_review: true
  cache_results: true

runtime:
  run_root: runs
  output_language: zh-CN
  max_parallel_calls: 5
  parse_retries: 1
  request_retries: 2
  checkpoint_every_stage: true
  save_raw_provider_responses: true
  redact_prompts_in_console: true
  # Live progress shows only stage summaries and structured outcomes, never raw chain of thought.
  activity_mode: compact
  activity_max_visible: 18
  activity_persist: true
  activity_include_agent_calls: true
  activity_heartbeat_seconds: 20
  log_level: INFO
  random_seed: 20260719
