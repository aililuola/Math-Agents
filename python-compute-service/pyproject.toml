[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mathproofmesh-compute-service"
version = "0.8.0"
description = "Independent bounded stdio compute sidecar for JavaMathProofMesh"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mpmath==1.3.0",
  "sympy==1.14.0",
  "z3-solver==4.16.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
